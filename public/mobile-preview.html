<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prévia mobile — CEI Itaipu</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: start center;
        padding: 18px;
        background: #e7dfd2;
        font-family: Arial, Helvetica, sans-serif;
      }
      .phone {
        width: 414px;
        padding: 10px;
        border: 1px solid #564946;
        border-radius: 38px;
        background: #302d2d;
        box-shadow: 0 24px 70px rgba(48, 45, 45, 0.24);
      }
      .screen {
        display: block;
        width: 390px;
        height: 844px;
        border: 0;
        border-radius: 29px;
        background: #fbf8f2;
      }
    </style>
  </head>
  <body>
    <div class="phone" aria-label="Prévia responsiva em um celular">
      <iframe class="screen" src="./" title="CEI Itaipu — versão para celular"></iframe>
    </div>
  </body>
</html>
